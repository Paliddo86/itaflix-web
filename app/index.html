<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      CRITICO: vixsrc.to (Cloudflare WAF) risponde 403 "Sorry, you have been blocked"
      a qualunque richiesta con header Referer di un dominio terzo.
      Con questa policy le richieste di hls.js (manifest, chiave AES, segmenti)
      partono senza Referer e vengono servite correttamente.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="ITAFlix - film e serie TV in italiano" />

    <!-- PWA: icona "Aggiungi a Home" su iOS e installazione su Android/desktop -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ITAFlix" />

    <title>ITAFlix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
